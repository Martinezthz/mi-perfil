<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Profesional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #050505; color: #e2e8f0; }
        .glass { background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(10px); border: 1px solid rgba(59, 130, 246, 0.2); }
        .blue-gradient-text { background: linear-gradient(to right, #3b82f6, #1d4ed8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .card-hover:hover { transform: translateY(-5px); border-color: #3b82f6; transition: all 0.3s ease; }
    </style>
</head>
<body class="font-sans antialiased">

    <!-- Navegación -->
    <nav class="p-6 flex justify-between items-center max-w-6xl mx-auto">
        <h1 id="nav-nombre" class="text-xl font-bold blue-gradient-text">Cargando...</h1>
        <div class="space-x-4">
            <a href="#sobre-mi" class="hover:text-blue-400 transition">Sobre mí</a>
            <a href="#certificados" class="hover:text-blue-400 transition">Certificados</a>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="py-20 px-6 text-center max-w-4xl mx-auto">
        <h2 id="hero-nombre" class="text-5xl md:text-7xl font-extrabold mb-4"></h2>
        <p id="hero-rol" class="text-xl md:text-2xl text-blue-400 mb-8 font-light italic"></p>
        
        <div class="flex justify-center space-x-6 mb-12" id="redes-sociales">
            <!-- Iconos se cargan vía JS -->
        </div>

        <div class="flex flex-col md:flex-row justify-center gap-4">
            <a id="btn-ver-cv" target="_blank" class="px-8 py-3 bg-blue-600 hover:bg-blue-700 rounded-full font-bold transition">Ver CV Online</a>
            <a id="btn-descargar-cv" download class="px-8 py-3 border border-blue-600 hover:bg-blue-600/20 rounded-full font-bold transition">Descargar CV</a>
        </div>
    </section>

    <!-- Sobre Mí -->
    <section id="sobre-mi" class="py-20 px-6 max-w-4xl mx-auto">
        <div class="glass p-8 rounded-3xl">
            <h3 class="text-3xl font-bold mb-4 border-b border-blue-900 pb-2">Sobre mí</h3>
            <p id="bio-texto" class="text-lg leading-relaxed text-slate-400"></p>
        </div>
    </section>

    <!-- Certificados -->
    <section id="certificados" class="py-20 px-6 max-w-6xl mx-auto">
        <h3 class="text-3xl font-bold mb-10 text-center">Certificaciones y Logros</h3>
        <div id="grid-certificados" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Cards se cargan vía JS -->
        </div>
    </section>

    <footer class="py-10 text-center border-t border-blue-900/30 text-slate-500">
        <p>© <span id="year"></span> - Portafolio Profesional</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
